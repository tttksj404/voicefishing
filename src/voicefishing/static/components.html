<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Qwen IDE components</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/workbench.css?v=ide-20260826-4" />
  </head>
  <body class="showcase-page">
    <main class="component-showcase" aria-labelledby="showcase-title">
      <header class="showcase-header">
        <div>
          <p class="eyebrow">VISUAL QA HARNESS</p>
          <h1 id="showcase-title">Local Qwen IDE 구성요소</h1>
        </div>
        <a class="quiet-link" href="/">워크벤치로 돌아가기</a>
      </header>

      <section class="showcase-section" aria-labelledby="status-title">
        <h2 id="status-title">상태 표식</h2>
        <div class="showcase-row">
          <span class="status-marker is-ready">검증됨</span>
          <span class="status-marker is-running">생성 중</span>
          <span class="status-marker is-warning">주의 필요</span>
          <span class="status-marker is-error">차단됨</span>
        </div>
      </section>

      <section class="showcase-section" aria-labelledby="button-title">
          <h2 id="button-title">명시적 동작 버튼</h2>
          <div class="showcase-row">
            <button class="command-button" type="button">Qwen에게 묻기 <kbd>Ctrl+Enter</kbd></button>
            <button class="command-button is-loading" type="button" aria-busy="true">저장 중</button>
            <button class="command-button" type="button" disabled>실행 불가</button>
            <button class="quiet-button" type="button">요청 지우기</button>
          </div>
      </section>

      <section class="showcase-section" aria-labelledby="editor-title">
          <h2 id="editor-title">파일 편집과 Qwen 상태</h2>
          <div class="showcase-grid">
            <nav class="file-list" aria-label="파일 항목 예시">
              <button class="file-item is-active" type="button" aria-current="page">
                <span class="file-extension">PY</span>
                <span class="file-item-label">src/voicefishing/web.py</span>
              </button>
              <button class="file-item" type="button">
                <span class="file-extension">MD</span>
                <span class="file-item-label">README.md</span>
              </button>
            </nav>
            <label class="showcase-field">
              <span>수정된 파일</span>
              <textarea rows="4" aria-label="수정된 파일">def local_only() -> bool:
    return True</textarea>
          </label>
          <div class="output-console compact-console">
            <div class="console-header">
              <h3>빈 출력</h3>
              <span class="status-marker">대기</span>
            </div>
            <p class="output-text">아직 모델을 실행하지 않았습니다.</p>
          </div>
          <div class="output-console compact-console blocked-console">
            <div class="console-header">
              <h3>차단된 출력</h3>
              <span class="status-marker is-error">차단됨</span>
            </div>
            <p class="output-text">민감한 형태의 입력은 실행 전에 차단됩니다.</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
